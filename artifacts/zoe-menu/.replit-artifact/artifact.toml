kind = "web"
previewPath = "/"
title = "ZOE Menu"
version = "1.0.0"
id = "artifacts/zoe-menu"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25327

[services.development]
run = "pnpm --filter @workspace/zoe-menu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zoe-menu", "run", "build" ]
publicDir = "artifacts/zoe-menu/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25327"
BASE_PATH = "/"
