<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ZOE Premium Bar &amp; Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#122336;--navy-dark:#0f1e2e;--navy-mid:#1a3148;
  --gold:#c8a97e;--cream:#f4f1ec;--cream2:#e8e4dd;
}
html{scroll-behavior:smooth}
body{
  font-family:'Cormorant Garamond',Georgia,serif;
  background:var(--cream);color:#2c3e50;
  min-height:100vh;font-size:16px;
}

/* ── HEADER ── */
.header{
  background:linear-gradient(180deg,#0a1520 0%,var(--navy) 100%);
  text-align:center;padding:2rem 1rem 0;
  position:relative;
}
.header-inner{
  background-image:url('interior.jpg');
  background-size:cover;background-position:center;
  position:absolute;inset:0;opacity:0.18;
}
.logo-text{
  font-size:2.8rem;font-weight:700;letter-spacing:0.12em;
  color:var(--cream);position:relative;z-index:1;
  text-shadow:0 2px 20px rgba(0,0,0,0.6);
}
.logo-sub{
  font-size:0.62rem;letter-spacing:0.45em;color:var(--gold);
  text-transform:uppercase;position:relative;z-index:1;
  margin-top:-0.3rem;display:block;
}
.tagline{
  font-size:0.7rem;letter-spacing:0.35em;color:rgba(244,241,236,0.55);
  text-transform:uppercase;margin:0.8rem 0 1rem;
  position:relative;z-index:1;
}

/* ── LANGUAGE PICKER ── */
.lang-bar{
  position:fixed;top:0.6rem;right:0.7rem;z-index:9000;
}
.lang-btn{
  background:rgba(15,30,46,0.92);border:1px solid rgba(200,169,126,0.35);
  color:var(--gold);font-family:inherit;font-size:0.72rem;
  letter-spacing:0.12em;padding:0.35rem 0.7rem;border-radius:4px;
  cursor:pointer;display:flex;align-items:center;gap:0.4rem;
}
.lang-dropdown{
  display:none;position:absolute;right:0;top:calc(100% + 4px);
  background:rgba(15,30,46,0.97);border:1px solid rgba(200,169,126,0.2);
  border-radius:4px;overflow:hidden;min-width:70px;
}
.lang-dropdown.open{display:block}
.lang-option{
  display:block;width:100%;padding:0.5rem 0.8rem;
  background:none;border:none;color:rgba(244,241,236,0.7);
  font-family:inherit;font-size:0.72rem;letter-spacing:0.1em;
  cursor:pointer;text-align:left;
}
.lang-option:hover,.lang-option.active{color:var(--gold);background:rgba(200,169,126,0.08)}

/* ── EVENTI BUTTON ── */
.eventi-btn{
  position:relative;z-index:1;
  display:inline-block;margin:0.3rem 0 1.4rem;
  border:1px solid var(--gold);color:var(--gold);
  background:none;font-family:inherit;font-size:0.72rem;
  letter-spacing:0.3em;padding:0.65rem 2rem;cursor:pointer;
  text-transform:uppercase;transition:all 0.2s;border-radius:2px;
}
.eventi-btn:hover{background:rgba(200,169,126,0.1)}

/* ── CATEGORY GRID ── */
.cat-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--navy-dark);position:sticky;top:0;z-index:500;
}
.cat-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0.8rem 0.4rem;gap:0.3rem;cursor:pointer;
  border-right:1px solid rgba(255,255,255,0.06);
  border-bottom:1px solid rgba(255,255,255,0.06);
  transition:background 0.2s;background:var(--navy-dark);
  border:none;font-family:inherit;color:rgba(244,241,236,0.55);
}
.cat-cell:hover{background:rgba(200,169,126,0.06)}
.cat-cell.active{
  background:rgba(200,169,126,0.1);color:var(--cream);
  border-bottom:2px solid var(--gold);
}
.cat-icon{width:28px;height:28px}
.cat-icon svg{width:100%;height:100%}
.cat-label{font-size:0.55rem;letter-spacing:0.2em;text-transform:uppercase;text-align:center}

/* ── SUB TABS ── */
.sub-tabs{
  display:flex;overflow-x:auto;background:var(--cream);
  border-bottom:1px solid rgba(200,169,126,0.15);
  scrollbar-width:none;position:sticky;top:72px;z-index:400;
}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{
  flex-shrink:0;padding:0.7rem 1.1rem;font-family:inherit;
  font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;
  background:none;border:none;border-bottom:2px solid transparent;
  color:rgba(44,62,80,0.45);cursor:pointer;transition:all 0.2s;
  white-space:nowrap;
}
.sub-tab:hover{color:var(--navy)}
.sub-tab.active{color:var(--navy);border-bottom-color:var(--gold);font-weight:600}

/* ── CONTENT AREA ── */
.content{
  background:var(--cream);padding:0 0 2rem;
  max-width:600px;margin:0 auto;
}
.sec-header{text-align:center;padding:2rem 1.5rem 1.2rem}
.sec-rule{border:none;border-top:1px solid rgba(200,169,126,0.3);margin:0.5rem auto;max-width:120px}
.sec-title{
  font-size:1.4rem;letter-spacing:0.25em;color:var(--navy);
  text-transform:uppercase;padding:0.4rem 0;
}
.small-note{
  text-align:center;font-size:0.72rem;color:rgba(44,62,80,0.45);
  font-style:italic;letter-spacing:0.05em;padding:0 1.5rem 0.5rem;
}
.section-note{
  text-align:center;font-size:0.72rem;color:rgba(44,62,80,0.45);
  font-style:italic;letter-spacing:0.04em;padding:0.5rem 1.5rem 1rem;
  line-height:1.6;
}

/* ── ITEM ROW ── */
.item-row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:0.95rem 1.5rem;border-bottom:1px solid rgba(200,169,126,0.12);
}
.item-row:last-child{border-bottom:none}
.item-name{font-size:0.95rem;color:var(--navy);letter-spacing:0.02em}
.item-note{font-size:0.68rem;color:rgba(44,62,80,0.4);font-style:italic;margin-top:0.15rem}
.item-price{font-size:0.88rem;color:var(--navy);font-weight:600;white-space:nowrap;margin-left:0.5rem}

/* ── SIG CARD ── */
.sig-card{
  display:flex;align-items:flex-start;gap:0.6rem;
  padding:0.95rem 1.5rem;border-bottom:1px solid rgba(200,169,126,0.12);
}
.sig-card:last-child{border-bottom:none}
.sig-info-btn{
  flex-shrink:0;width:22px;height:22px;border-radius:50%;
  border:1px solid rgba(200,169,126,0.4);background:none;
  color:var(--gold);font-size:0.65rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;margin-top:2px;font-family:inherit;
}
.sig-info-btn:hover{background:rgba(200,169,126,0.15)}
.sig-body{flex:1}
.sig-name{font-size:0.95rem;color:var(--navy);font-weight:600;letter-spacing:0.02em}
.sig-ingredients{font-size:0.72rem;color:rgba(44,62,80,0.5);font-style:italic;margin-top:0.2rem;line-height:1.4}
.sig-price{font-size:0.88rem;color:var(--navy);font-weight:600;white-space:nowrap;margin-left:auto;padding-left:0.5rem;flex-shrink:0}
.info-spacer{width:22px;flex-shrink:0}

/* ── MILK MUG CARD ── */
.mug-card{
  display:flex;align-items:flex-start;gap:0.8rem;
  padding:0.9rem 1.5rem;border-bottom:1px solid rgba(200,169,126,0.12);
}
.mug-img{width:64px;height:64px;object-fit:cover;border-radius:4px;flex-shrink:0}
.mug-body{flex:1}
.mug-name{font-size:0.95rem;color:var(--navy);font-weight:600}
.mug-desc{font-size:0.72rem;color:rgba(44,62,80,0.5);font-style:italic;margin-top:0.2rem;line-height:1.4}
.mug-price{font-size:0.88rem;color:var(--navy);font-weight:600;white-space:nowrap;margin-left:auto;padding-left:0.5rem;flex-shrink:0}

/* ── WINE TABLE ── */
.wine-header{
  display:grid;grid-template-columns:1fr 80px 80px;
  padding:0.4rem 1.5rem;
}
.wine-header-label{
  font-size:0.6rem;letter-spacing:0.2em;color:rgba(44,62,80,0.4);
  text-transform:uppercase;text-align:right;
}
.wine-header-label:first-child{text-align:left}
.wine-row{
  display:grid;grid-template-columns:1fr 80px 80px;
  padding:0.9rem 1.5rem;border-bottom:1px solid rgba(200,169,126,0.12);
  align-items:center;
}
.wine-row:last-child{border-bottom:none}
.wine-name{font-size:0.88rem;color:var(--navy)}
.wine-price{font-size:0.82rem;color:var(--navy);font-weight:600;text-align:right}

/* ── COCKTAIL PHOTO STRIP ── */
.cph-wrapper{width:100%;margin-top:2.5rem}
.cph-title{
  font-size:1.05rem;font-weight:600;letter-spacing:0.2em;
  color:var(--gold);text-align:center;text-transform:uppercase;
  margin-bottom:0.9rem;
}
.cph-strip{display:flex;width:100%}
.cph-cell{flex:1;aspect-ratio:1/1;overflow:hidden;background:rgba(200,169,126,0.06);border:1px solid rgba(200,169,126,0.1)}
.cph-img{width:100%;height:100%;object-fit:cover;display:block}

/* ── FOOTER ── */
.footer{
  background:var(--navy-dark);padding:2.5rem 1.5rem;
  text-align:center;
}
.footer-title{
  font-size:0.7rem;letter-spacing:0.3em;color:var(--gold);
  text-transform:uppercase;margin-bottom:1.2rem;
}
.hours-grid{max-width:300px;margin:0 auto 1.5rem;display:flex;flex-direction:column;gap:0.35rem}
.hours-row{display:flex;justify-content:space-between;font-size:0.78rem}
.hours-day{color:rgba(244,241,236,0.55);letter-spacing:0.05em}
.hours-time{color:rgba(244,241,236,0.8);font-weight:600}
.hours-closed{color:rgba(244,241,236,0.3);font-style:italic}
.footer-rule{border:none;border-top:1px solid rgba(200,169,126,0.15);max-width:300px;margin:1.5rem auto}

/* Social buttons */
.social-btns{display:flex;flex-direction:column;gap:0.7rem;align-items:center;margin:0 auto 1.5rem;max-width:360px}
.social-btn{
  display:flex;align-items:center;justify-content:center;gap:0.6rem;
  padding:0.75rem 1.2rem;border:1px solid rgba(200,169,126,0.25);
  border-radius:4px;background:none;color:rgba(244,241,236,0.75);
  font-family:inherit;font-size:0.72rem;letter-spacing:0.15em;
  text-decoration:none;width:100%;max-width:360px;
  transition:all 0.2s;text-transform:uppercase;
}
.social-btn:hover{background:rgba(200,169,126,0.08);color:var(--gold);border-color:rgba(200,169,126,0.5)}
.social-btn svg{flex-shrink:0}

/* ── GALLERY CAROUSEL ── */
.gallery-wrap{max-width:360px;margin:0 auto 1.5rem;position:relative}
.gallery-track{position:relative;width:100%;height:200px;overflow:hidden}
.g-slide{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;transition:transform 0.6s cubic-bezier(0.4,0,0.2,1);
}
.g-current{transform:translateX(0);z-index:2}
.g-prev{transform:translateX(-100%);z-index:1}
.g-next{transform:translateX(100%);z-index:1}
.g-far{transform:translateX(100%);z-index:0;pointer-events:none}
.gallery-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  background:none;border:none;color:rgba(255,255,255,0.7);
  font-size:2.2rem;line-height:1;cursor:pointer;
  text-shadow:0 2px 8px rgba(0,0,0,0.8);z-index:3;padding:0.3rem;
}
.gallery-arrow:hover{color:var(--gold)}
.gallery-prev{left:0.3rem}
.gallery-next{right:0.3rem}

/* Address */
.footer-address{margin:0 auto;max-width:340px;padding:1rem 0}
.footer-address-name{font-size:0.85rem;letter-spacing:0.15em;color:rgba(244,241,236,0.7);margin-bottom:0.4rem}
.footer-address-line{font-size:0.75rem;color:rgba(244,241,236,0.45);letter-spacing:0.05em;line-height:1.6}
.footer-copy{font-size:0.62rem;color:rgba(244,241,236,0.2);letter-spacing:0.15em;text-transform:uppercase;margin-top:1.5rem}

/* ── MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);
  z-index:8000;align-items:center;justify-content:center;padding:1rem;
}
.modal-overlay.open{display:flex}
.modal-box{
  background:var(--navy-dark);border:1px solid rgba(200,169,126,0.25);
  border-radius:6px;max-width:380px;width:100%;padding:2rem 1.5rem 1.5rem;
  position:relative;
}
.modal-close{
  position:absolute;top:0.75rem;right:0.85rem;background:none;border:none;
  color:rgba(244,241,236,0.4);font-size:1rem;cursor:pointer;font-family:inherit;
}
.modal-close:hover{color:var(--gold)}
.modal-label{font-size:0.62rem;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;margin-bottom:0.5rem}
.modal-name{font-size:1.1rem;color:var(--cream);font-weight:600;margin-bottom:0.8rem}
.modal-desc{font-size:0.82rem;color:rgba(244,241,236,0.65);font-style:italic;line-height:1.6}

/* ── EVENTI MODAL ── */
.eventi-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.82);
  z-index:9500;align-items:center;justify-content:center;padding:1rem;
}
.eventi-overlay.open{display:flex}
.eventi-modal{
  background:var(--navy-dark);border:1px solid rgba(200,169,126,0.25);
  border-radius:6px;width:100%;max-width:480px;max-height:88vh;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  box-shadow:0 24px 64px rgba(0,0,0,0.7);
}
.eventi-close{
  position:absolute;top:0.75rem;right:0.85rem;background:none;border:none;
  color:rgba(244,241,236,0.45);font-size:1rem;cursor:pointer;z-index:2;font-family:inherit;
}
.eventi-close:hover{color:var(--gold)}
.eventi-title-bar{
  font-size:0.72rem;letter-spacing:0.3em;color:var(--gold);
  text-align:center;padding:1.2rem 2rem 0.8rem;font-weight:600;
}
.ev-track{position:relative;width:100%;height:62vh;overflow:hidden}
.ev-slide{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;
  transition:transform 0.6s cubic-bezier(0.4,0,0.2,1);
}
.ev-current{transform:translateX(0);z-index:2}
.ev-prev{transform:translateX(-100%);z-index:1}
.ev-next{transform:translateX(100%);z-index:1}
.ev-far{transform:translateX(100%);z-index:0;pointer-events:none}
.ev-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  background:none;border:none;color:rgba(255,255,255,0.7);
  font-size:2.8rem;line-height:1;cursor:pointer;
  text-shadow:0 2px 10px rgba(0,0,0,0.9);z-index:3;padding:0.4rem;
}
.ev-arrow:hover{color:var(--gold)}
.ev-arr-prev{left:0.3rem}
.ev-arr-next{right:0.3rem}
.ev-counter{font-size:0.68rem;letter-spacing:0.2em;color:rgba(244,241,236,0.3);padding:0.55rem 0 0.7rem;text-align:center}

/* Responsive */
@media(max-width:360px){
  .logo-text{font-size:2.2rem}
  .cat-label{font-size:0.48rem}
}
</style>
</head>

<!-- ── LANGUAGE PICKER ── -->
<div class="lang-bar">
  <button class="lang-btn" id="langBtn" onclick="toggleLang()">
    <span id="langCurrent">IT</span> ▾
  </button>
  <div class="lang-dropdown" id="langDropdown">
    <button class="lang-option active" data-lang="it" onclick="setLang('it')">IT</button>
    <button class="lang-option" data-lang="en" onclick="setLang('en')">EN</button>
    <button class="lang-option" data-lang="es" onclick="setLang('es')">ES</button>
    <button class="lang-option" data-lang="de" onclick="setLang('de')">DE</button>
    <button class="lang-option" data-lang="fr" onclick="setLang('fr')">FR</button>
  </div>
</div>

<!-- ── HEADER ── -->
<header class="header">
  <div class="header-inner"></div>
  <div class="logo-text">ZOE<span class="logo-sub">Premium Bar &amp; Restaurant</span></div>
  <p class="tagline" id="tagline">Premium Bar &amp; Restaurant</p>
  <button class="eventi-btn" onclick="openEventi()">◆ EVENTI ◆</button>
</header>

<!-- ── CATEGORY GRID ── -->
<div class="cat-grid" id="catGrid"></div>

<!-- ── SUB TABS ── -->
<div class="sub-tabs" id="subTabs"></div>

<!-- ── CONTENT ── -->
<div class="content" id="menuContent"></div>

<!-- ── FOOTER ── -->
<footer class="footer" id="footerEl"></footer>

<!-- ── INFO MODAL ── -->
<div class="modal-overlay" id="infoModal" onclick="closeInfoModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeInfoModal()">✕</button>
    <p class="modal-label" id="modalLabel"></p>
    <p class="modal-name" id="modalName"></p>
    <p class="modal-desc" id="modalDesc"></p>
  </div>
</div>

<!-- ── EVENTI MODAL ── -->
<div class="eventi-overlay" id="eventiOverlay" onclick="closeEventi(event)">
  <div class="eventi-modal" onclick="event.stopPropagation()">
    <button class="eventi-close" onclick="closeEventi()">✕</button>
    <p class="eventi-title-bar">EVENTI</p>
    <div class="ev-track" id="evTrack"></div>
    <button class="ev-arrow ev-arr-prev" onclick="evPrev()">&#8249;</button>
    <button class="ev-arrow ev-arr-next" onclick="evNext()">&#8250;</button>
    <p class="ev-counter" id="evCounter"></p>
  </div>
</div>

function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function itemRow(item){
  return `<div class="item-row">
    <div><div class="item-name">${h(item.n)}</div>${item.note?`<div class="item-note">${h(item.note)}</div>`:''}
    </div><div class="item-price">${h(item.p||'')}</div></div>`;
}

function sigCard(item,showInfo=false){
  const desc=item.d?item.d[lang]:'';
  const infoBtn=showInfo?`<button class="sig-info-btn" onclick="openInfo(${JSON.stringify(h(item.n))},${JSON.stringify(h(desc))})" title="Info">ℹ</button>`:'<div class="info-spacer"></div>';
  return `<div class="sig-card">${infoBtn}
    <div class="sig-body"><div class="sig-name">${h(item.n)}</div>${desc?`<div class="sig-ingredients">${h(desc)}</div>`:''}
    </div><div class="sig-price">${h(item.p)}</div></div>`;
}

function wineRows(arr,t){
  return `<div class="wine-header"><span class="wine-header-label"></span><span class="wine-header-label">${h(t.glass)}</span><span class="wine-header-label">${h(t.bottle)}</span></div>`+
  arr.map(w=>`<div class="wine-row"><div class="wine-name">${h(w.n)}</div><div class="wine-price">${w.g||'—'}</div><div class="wine-price">${w.b||'—'}</div></div>`).join('');
}

function mugCard(m){
  const desc=m.d[lang];
  return `<div class="mug-card"><img class="mug-img" src="${h(m.img)}" alt="${h(m.n)}" loading="lazy">
    <div class="mug-body"><div class="mug-name">${h(m.n)}</div><div class="mug-desc">${h(desc)}</div></div>
    <div class="mug-price">${h(m.p)}</div></div>`;
}

function cocktailPhotoStrip(t){
  return `<div class="cph-wrapper"><p class="cph-title">${h(t.iAmati)}</p>
    <div class="cph-strip">${cocktailPhotos.map(src=>`<div class="cph-cell"><img class="cph-img" src="${h(src)}" alt="cocktail" loading="lazy"></div>`).join('')}</div></div>`;
}

function secHeader(title){
  return `<div class="sec-header"><hr class="sec-rule"><h2 class="sec-title">${h(title)}</h2><hr class="sec-rule"></div>`;
}

function renderContent(){
  const t=T[lang];
  const tabs=subTabs(t);
  const tab=tabs[mainCat].find(x=>x.k===subCat)||tabs[mainCat][0];
  let html='';

  if(mainCat==='bar'){
    const data={softDrinks,beers,craftBeers,draftBeers,aperitifs,amari};
    const items=data[subCat]||softDrinks;
    html+=secHeader(tab.l)+items.map(i=>itemRow(i)).join('');
  }
  else if(mainCat==='cocktails'){
    if(subCat==='signature'){
      html+=secHeader(tab.l)+`<p class="small-note">${h(t.ibaNotes)} &nbsp;·&nbsp; ${h(t.premiumIba)}</p>`;
      html+=signatures.map(i=>sigCard(i,true)).join('');
      html+=`<p class="small-note" style="margin-top:1.5rem">${h(t.signatureNote)}</p>`;
      html+=cocktailPhotoStrip(t);
    } else {
      html+=secHeader(tab.l);
      html+=mocktails.map(i=>sigCard(i,true)).join('');
      html+=cocktailPhotoStrip(t);
    }
  }
  else if(mainCat==='spirits'){
    const data={gin:ginTonics,vodka:vodkaTonics,rum:rums,whiskey:whiskeys,grappa:grappas,tequila:tequilas,amari};
    const items=data[subCat]||ginTonics;
    html+=secHeader(tab.l)+items.map(i=>itemRow(i)).join('');
  }
  else if(mainCat==='wine'){
    const data={red:redWines,white:whiteWines,sparkling};
    const items=data[subCat]||redWines;
    html+=secHeader(tab.l)+wineRows(items,t);
  }
  else if(mainCat==='food'){
    if(subCat==='snacks') html+=secHeader(tab.l)+snacks.map(i=>itemRow(i)).join('');
    else if(subCat==='bruschette') html+=secHeader(tab.l)+bruschette.map(i=>itemRow(i)).join('');
    else if(subCat==='pinse'){
      html+=secHeader(tab.l);
      html+=pinse.map(i=>sigCard(i,false)).join('');
      html+=`<p class="section-note">${h(t.tableService)}</p>`;
    }
    else if(subCat==='taglieri'){
      html+=secHeader(tab.l)+taglieri.map(i=>itemRow(i)).join('');
      html+=`<p class="section-note">${h(t.taiglieriNote)}</p>`;
    }
  }
  else if(mainCat==='coffee'){
    if(subCat==='coffee') html+=secHeader(tab.l)+coffees.map(i=>itemRow(i)).join('')+`<p class="section-note">${h(t.correctionFee)}</p><p class="section-note">${h(t.coffeeHoursNote)}</p>`;
    else if(subCat==='specialCoffee') html+=secHeader(tab.l)+coffeeSpecials.map(i=>sigCard(i,true)).join('');
    else if(subCat==='hotChoc') html+=secHeader(tab.l)+hotChocolates.map(i=>itemRow(i)).join('');
    else if(subCat==='milkMugs') html+=secHeader(tab.l)+milkMugs.map(m=>mugCard(m)).join('');
    else if(subCat==='dessert') html+=secHeader(tab.l)+desserts.map(i=>itemRow(i)).join('');
    else if(subCat==='fruit') html+=secHeader(tab.l)+fruits.map(i=>itemRow(i)).join('');
  }

  document.getElementById('menuContent').innerHTML=html;
}

function renderCatGrid(){
  const t=T[lang];
  document.getElementById('catGrid').innerHTML=cats(t).map(c=>
    `<button class="cat-cell${mainCat===c.id?' active':''}" onclick="selectCat('${c.id}')">
      <div class="cat-icon">${c.icon}</div>
      <span class="cat-label">${h(c.label)}</span>
    </button>`
  ).join('');
}

function renderSubTabs(){
  const t=T[lang];
  const tabs=subTabs(t)[mainCat];
  document.getElementById('subTabs').innerHTML=tabs.map(tab=>
    `<button class="sub-tab${subCat===tab.k?' active':''}" onclick="selectSub('${tab.k}')">${h(tab.l)}</button>`
  ).join('');
}

function renderFooter(){
  const t=T[lang];
  const hours=[
    [t.monday,t.monHours,false],[t.tuesday,t.tueHours,true],[t.wednesday,t.wedHours,false],
    [t.thursday,t.thuHours,false],[t.friday,t.friHours,false],[t.saturday,t.satHours,false],[t.sunday,t.sunHours,false],
  ];
  const hoursHtml=hours.map(([d,h2,closed])=>
    `<div class="hours-row"><span class="hours-day">${h(d)}</span><span class="${closed?'hours-closed':'hours-time'}">${h(h2)}</span></div>`
  ).join('');

  const galleryHtml=`<div class="gallery-wrap">
    <div class="gallery-track" id="galleryTrack"></div>
    <button class="gallery-arrow gallery-prev" onclick="gPrev()">&#8249;</button>
    <button class="gallery-arrow gallery-next" onclick="gNext()">&#8250;</button>
  </div>`;

  document.getElementById('footerEl').innerHTML=`
    <p class="footer-title">${h(t.openingHours)}</p>
    <div class="hours-grid">${hoursHtml}</div>
    <hr class="footer-rule">
    <div class="social-btns">
      <a class="social-btn" href="https://www.instagram.com/zoebarnapoli" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        ${h(t.followUs)}
      </a>
      <a class="social-btn" href="https://wa.me/393881392742" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
        ${h(t.contactUs)}
      </a>
      <a class="social-btn" href="https://maps.app.goo.gl/zoebarreview" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        ${h(t.leaveReview)}
      </a>
    </div>
    ${galleryHtml}
    <hr class="footer-rule">
    <div class="footer-address">
      <p class="footer-address-name">ZOE Premium Bar &amp; Restaurant</p>
      <p class="footer-address-line">Via Appia Antica, San Prisco (CE)</p>
      <p class="footer-address-line">Affianco all'uscita San Prisco della Variante Capua–Maddaloni</p>
    </div>
    <p class="footer-copy">© ZOE Premium Bar &amp; Restaurant</p>
  `;
  initGallery();
}

function render(){
  const t=T[lang];
  document.getElementById('tagline').textContent=t.tagline;
  renderCatGrid();
  renderSubTabs();
  renderContent();
  renderFooter();
}

// ════════════════════════════════════════════════════
// ACTIONS
// ════════════════════════════════════════════════════
function selectCat(id){
  mainCat=id;
  const t=T[lang];
  subCat=subTabs(t)[id][0].k;
  renderCatGrid();renderSubTabs();renderContent();
}

function selectSub(k){
  subCat=k;
  renderSubTabs();renderContent();
  window.scrollTo({top:document.getElementById('subTabs').offsetTop-72,behavior:'smooth'});
}

// ── LANGUAGE ──
function toggleLang(){
  document.getElementById('langDropdown').classList.toggle('open');
}
function setLang(l){
  lang=l;
  document.getElementById('langCurrent').textContent=l.toUpperCase();
  document.getElementById('langDropdown').classList.remove('open');
  document.querySelectorAll('.lang-option').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  const t=T[lang];
  subCat=subTabs(t)[mainCat][0].k;
  render();
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.lang-bar')) document.getElementById('langDropdown').classList.remove('open');
});

// ── INFO MODAL ──
function openInfo(name,desc){
  const t=T[lang];
  document.getElementById('modalLabel').textContent=t.servingGuide;
  document.getElementById('modalName').textContent=name;
  document.getElementById('modalDesc').textContent=desc;
  document.getElementById('infoModal').classList.add('open');
}
function closeInfoModal(e){
  if(!e||!e.target.closest('.modal-box')) document.getElementById('infoModal').classList.remove('open');
}

// ── GALLERY CAROUSEL ──
function initGallery(){
  const track=document.getElementById('galleryTrack');
  if(!track) return;
  track.innerHTML=galleryPhotos.map((src,i)=>`<img class="g-slide${i===0?' g-current':i===1?' g-next':' g-far'}" src="${src}" alt="gallery ${i+1}" loading="lazy">`).join('');
  if(gTimer) clearInterval(gTimer);
  gTimer=setInterval(()=>gNext(true),4000);
  let tx=0;
  track.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  track.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(dx<-40)gNext();else if(dx>40)gPrev();});
}

function gClass(i){
  const total=galleryPhotos.length;
  const rel=(i-gIdx+total)%total;
  if(rel===0) return 'g-slide g-current';
  if(rel===1) return 'g-slide g-next';
  if(rel===total-1) return 'g-slide g-prev';
  return 'g-slide g-far';
}
function gApply(){
  const imgs=document.querySelectorAll('#galleryTrack .g-slide');
  imgs.forEach((img,i)=>{img.className=gClass(i);});
}
function gNext(auto=false){
  gIdx=(gIdx+1)%galleryPhotos.length;gApply();
  if(!auto){clearInterval(gTimer);gTimer=setInterval(()=>gNext(true),4000);}
}
function gPrev(){
  gIdx=(gIdx-1+galleryPhotos.length)%galleryPhotos.length;gApply();
  clearInterval(gTimer);gTimer=setInterval(()=>gNext(true),4000);
}

// ── EVENTI CAROUSEL ──
let evIdx=0,evTimer=null;

function openEventi(){
  const track=document.getElementById('evTrack');
  track.innerHTML=eventiPhotos.map((src,i)=>`<img class="ev-slide${i===0?' ev-current':i===1?' ev-next':' ev-far'}" src="${src}" alt="evento ${i+1}" loading="lazy">`).join('');
  evIdx=0;
  document.getElementById('evCounter').textContent=`1 / ${eventiPhotos.length}`;
  document.getElementById('eventiOverlay').classList.add('open');
  if(evTimer) clearInterval(evTimer);
  evTimer=setInterval(()=>evNextAuto(),4500);
  // touch
  let tx=0;
  track.ontouchstart=e=>{tx=e.touches[0].clientX};
  track.ontouchend=e=>{const dx=e.changedTouches[0].clientX-tx;if(dx<-40)evNext();else if(dx>40)evPrev();};
}
function closeEventi(e){
  if(!e||!e.target.closest('.eventi-modal')){
    document.getElementById('eventiOverlay').classList.remove('open');
    if(evTimer){clearInterval(evTimer);evTimer=null;}
  }
}
function evApply(){
  const total=eventiPhotos.length;
  document.querySelectorAll('#evTrack .ev-slide').forEach((img,i)=>{
    const rel=(i-evIdx+total)%total;
    img.className='ev-slide '+(rel===0?'ev-current':rel===1?'ev-next':rel===total-1?'ev-prev':'ev-far');
  });
  document.getElementById('evCounter').textContent=`${evIdx+1} / ${total}`;
}
function evNextAuto(){evIdx=(evIdx+1)%eventiPhotos.length;evApply();}
function evNext(){evIdx=(evIdx+1)%eventiPhotos.length;evApply();clearInterval(evTimer);evTimer=setInterval(evNextAuto,4500);}
function evPrev(){evIdx=(evIdx-1+eventiPhotos.length)%eventiPhotos.length;evApply();clearInterval(evTimer);evTimer=setInterval(evNextAuto,4500);}

// ════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════
render();
</script>
</body>
</html>
